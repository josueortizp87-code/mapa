<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Trabajos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- ✅ Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1️⃣ Crear el mapa
  const map = L.map('map').setView([14.65, -86.21], 13);

  // 2️⃣ Capa base
  L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution: 'Tiles © Esri'
  }
).addTo(map);

  // 3️⃣ Leer puntos desde Cloudflare
  fetch("https://api-cuadrillas.cgujuticalpa.workers.dev/")
    .then(res => res.json())
    .then(data => {
      data.forEach(r => {
        if (r.lat_inicio && r.lng_inicio) {
          L.marker([r.lat_inicio, r.lng_inicio])
            .addTo(map)
            .bindPopup("Inicio<br>Circuito: " + r.circuito);
        }
        if (r.lat_final && r.lng_final) {
          L.marker([r.lat_final, r.lng_final])
            .addTo(map)
            .bindPopup("Fin<br>Circuito: " + r.circuito);
        }
      });
    });
</script>

</body>
</html>
