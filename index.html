<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mapa de Trabajos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ CSS de Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 n: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- ✅ JS de Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.jscript>
  // 1️⃣ Crear el mapa
  const map = L.map('map').setView([14.65, -86.21], 13);

  // 2️⃣ Cargar el mapa base
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 3️⃣ Puntos desde Cloudflare
  fetch("https://TU-WORKER.workers.dev/")
    .then(res => res.json())
    .then(data => {
      data.forEach(r => {

        if (r.lat_inicio && r.lng_inicio) {
          L.marker([r.lat_inicio, r.lng_inicio])
            .addTo(map)
            .bindPopup("Inicio<br>Circuito: " + r.circuito);
        }

        if (r.lat_final && r.lng_final) {
          L.marker([r.lat_final, r.lng_final])
            .addTo(map)
            .bindPopup("Fin<br>Circuito: " + r.circuito);
        }

      });
    });
</script>

</body>
</html>
